services:
  api:
    build: .
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      # override .env's host-path DATABASE_PATH — the db lives in the named
      # volume below, not a bind-mounted host file, so it's identical
      # whether you're on Linux, Windows, or macOS
      DATABASE_PATH: /data/local.db
    volumes:
      - ./src:/app/src
      - ./migrations:/app/migrations
      - ./scripts:/app/scripts
      - sqlite-data:/data
    command:
      [
        "uv",
        "run",
        "uvicorn",
        "main:app",
        "--app-dir",
        "src",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--reload",
      ]

volumes:
  sqlite-data:
