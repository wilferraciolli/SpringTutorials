<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
  <body style="margin: 0; padding: 0; background: #f7f5f1">
    <!--
      Shared shell for every insurly email. Table layout + inline styles only,
      for broad email-client support (no CSS custom properties, no <style>).
      Colours follow the "Ink & Signal" palette (DESIGN.md) as literals.
      Use:
        <body th:replace="~{email/_layout :: page('Title', 'Preheader', ~{::content})}">
          <div th:fragment="content"> ...body... </div>
        </body>
    -->
    <table
      th:fragment="page(title, preheader, content)"
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      width="100%"
      style="background: #f7f5f1; padding: 24px 12px"
    >
      <tr>
        <td align="center">
          <span
            th:text="${preheader}"
            style="display: none !important; visibility: hidden; opacity: 0; color: transparent; height: 0; width: 0; overflow: hidden"
          ></span>

          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            width="600"
            style="width: 600px; max-width: 100%; background: #ffffff; border: 1px solid #e2ddd4; border-radius: 10px; overflow: hidden; font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
          >
            <tr>
              <td style="padding: 20px 28px; border-bottom: 1px solid #e2ddd4">
                <span style="font-size: 18px; font-weight: 700; letter-spacing: -0.02em; color: #17171c">insurly</span>
                <span th:text="${title}" style="font-size: 13px; color: #6b6b76; margin-left: 10px"></span>
              </td>
            </tr>
            <tr>
              <td style="padding: 26px 28px; color: #3d3d46; font-size: 14px; line-height: 1.55">
                <div th:replace="${content}">body</div>
              </td>
            </tr>
            <tr>
              <td style="padding: 16px 28px; border-top: 1px solid #e2ddd4; background: #f7f5f1; font-size: 11px; color: #6b6b76">
                Sent by insurly &middot; automated message &middot; see docs/07-notifications.md for what triggers it.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
